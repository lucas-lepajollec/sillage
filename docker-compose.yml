services:
  sillage:
    image: ghcr.io/lucas-lepajollec/sillage:latest
    ports:
      - "2511:2511"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./config:/config
      - ${MEDIA_PATH:-./media}:/media:rw
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
