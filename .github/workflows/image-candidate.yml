name: Native image candidate

on:
  workflow_call:
    inputs:
      architecture:
        type: string
        required: true
    outputs:
      digest:
        description: Immutable image that passed native container smoke tests
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lucas-lepajollec/sillage

jobs:
  build:
    name: Build and smoke-test
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.verified.outputs.digest }}
    steps:
      - name: Validate native architecture
        env:
          TARGET_ARCH: ${{ inputs.architecture }}
        run: |
          case "$TARGET_ARCH" in amd64|arm64) ;; *) exit 1 ;; esac
          test "$(docker version --format '{{.Server.Arch}}')" = "$TARGET_ARCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.5'
          python-version: '3.12'
          enable-cache: true
      - name: Prepare smoke test
        run: |
          # Prefer Ubuntu's official HTTPS archive over the slow Azure mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg
          uv sync --frozen --extra dev
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and publish an untagged immutable candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ inputs.architecture }}
          pull: true
          build-args: VCS_REF=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=sillage-${{ inputs.architecture }},timeout=2m
          cache-to: type=gha,scope=sillage-${{ inputs.architecture }},mode=max,timeout=2m,ignore-error=true
          provenance: mode=max
          sbom: true
      - name: Smoke-test the exact registry candidate
        id: verified
        env:
          TARGET_ARCH: ${{ inputs.architecture }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="$IMAGE@$CANDIDATE_DIGEST"
          docker pull --platform "linux/$TARGET_ARCH" "$ref"
          actual="$(docker image inspect "$ref" --format '{{.Architecture}} {{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$actual" = "$TARGET_ARCH $GITHUB_SHA"
          SILLAGE_TEST_IMAGE="$ref" uv run python tests/docker_smoke.py
          echo "digest=$CANDIDATE_DIGEST" >> "$GITHUB_OUTPUT"
