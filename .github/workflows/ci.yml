name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source quality
    uses: ./.github/workflows/quality.yml
  container:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.5'
          python-version: '3.12'
          enable-cache: true
      - name: Prepare smoke-test dependencies
        run: |
          # Prefer Ubuntu's official HTTPS archive over the slow Azure mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg
          uv sync --frozen --extra dev
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: sillage:local
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=sillage-amd64,timeout=2m
          cache-to: type=gha,scope=sillage-amd64,mode=max,timeout=2m,ignore-error=true
      - name: Exercise the canonical Compose with real generated MKVs
        run: uv run python tests/docker_smoke.py
