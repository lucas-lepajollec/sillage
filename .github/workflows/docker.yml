name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lucas-lepajollec/sillage

jobs:
  verify:
    name: Verify source
    uses: ./.github/workflows/quality.yml
  amd64:
    name: Native amd64 image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-candidate.yml
    with:
      architecture: amd64
  arm64:
    name: Native arm64 image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-candidate.yml
    with:
      architecture: arm64
  publish:
    name: Publish verified image
    needs: [verify, amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate publication tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
      - name: Promote the two verified native digests without rebuilding
        env:
          AMD64_DIGEST: ${{ needs.amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.arm64.outputs.digest }}
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: scripts/publish-image.sh
