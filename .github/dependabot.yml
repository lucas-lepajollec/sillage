version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    groups:
      frontend-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:45'
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      base-images:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
