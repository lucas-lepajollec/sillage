[project]
name = "sillage"
version = "0.3.0"
description = "Safe, focused translation of embedded subtitles for a personal media library"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pysubs2>=1.8,<2", "cryptography>=44", "charset-normalizer>=3.4,<4"]

[project.optional-dependencies]
sync = ["ffsubsync>=0.4.29,<0.5"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/sillage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
